<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nowhere, man · Gianluca Guidi</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="/favicon.ico?v=40f1ebd" sizes="32x32">
  <link rel="icon" href="/favicon.svg?v=40f1ebd" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=40f1ebd">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <script>
    // the site used to live at /gian/: old links land on the same page at the root
    if (location.pathname.indexOf("/gian/") === 0) location.replace(location.pathname.slice(5) + location.search + location.hash);
    // same light / dark choice as the home page
    (function () {
      try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
    })();
  </script>
  <!-- Self-contained, since this page can be served from any path -->
  <style>
    :root{--bg:#fbfbfa;--text:#1c1c1c;--muted:#7a7a7a;--faint:#a8a8a8}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--text:#ededed;--muted:#8b8b8b;--faint:#5c5c5c;color-scheme:dark}}
    :root[data-theme="dark"]{--bg:#0f0f0f;--text:#ededed;--muted:#8b8b8b;--faint:#5c5c5c;color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.65 Geist, Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;-webkit-font-smoothing:antialiased}
    main{max-width:600px;margin:0 auto;padding:96px 24px 64px}
    .code{font:400 11px/1 "Geist Mono", ui-monospace, Menlo, monospace;color:var(--faint);margin:0 0 18px}
    h1{font-size:17px;font-weight:500;letter-spacing:-.01em;margin:0 0 8px}
    p{margin:0 0 14px;color:var(--muted)}
    a{color:var(--text);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
    a:hover{text-decoration-color:var(--text)}
    @media (max-width:520px){main{padding:56px 20px 48px}}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Nowhere, man.</h1>
    <p>This page isn’t here. A momentary lapse of reason, probably mine.</p>
    <p><a href="/">Get back</a></p>
  </main>
</body>
</html>
